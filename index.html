
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список студентов</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 40px 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            color: #2c3e50;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            margin: 5px 3px 10px 0;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background: #2878d0;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1c5fa8;
        }

        .delete-btn {
            background: #dc4c4c;
        }

        .delete-btn:hover {
            background: #b83232;
        }

        .edit-btn {
            background: #687786;
        }

        .edit-btn:hover {
            background: #4c5965;
        }

        .search {
            width: 100%;
            box-sizing: border-box;
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #f1f4f8;
        }

        tr:hover {
            background: #f8f9fb;
        }

        .actions {
            white-space: nowrap;
        }

        .actions button {
            margin: 2px;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px 8px;
            }

            .container {
                padding: 15px;
            }

            th, td {
                padding: 8px 5px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Список студентов</h1>

    <h3>Добавить студента</h3>

    <input id="name" placeholder="Имя студента">
    <input id="group" placeholder="Группа">
    <button onclick="addStudent()">Добавить</button>

    <h3>Все студенты</h3>

    <input
        id="search"
        class="search"
        placeholder="Поиск по имени или группе..."
        oninput="renderStudents()"
    >

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Имя</th>
                <th>Группа</th>
                <th>Действия</th>
            </tr>
        </thead>

        <tbody id="list"></tbody>
    </table>

</div>

<script>

let allStudents = [];

async function loadStudents() {
    const response = await fetch("/students");
    allStudents = await response.json();
    renderStudents();
}

function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

function renderStudents() {
    const list = document.getElementById("list");
    const search = document.getElementById("search").value.toLowerCase();

    list.innerHTML = "";

    const filteredStudents = allStudents.filter(s =>
        s.name.toLowerCase().includes(search) ||
        s.group.toLowerCase().includes(search)
    );

    for (const s of filteredStudents) {
        list.innerHTML += `
            <tr>
                <td>${s.id}</td>
                <td>${escapeHtml(s.name)}</td>
                <td>${escapeHtml(s.group)}</td>
                <td class="actions">
                    <button class="edit-btn"
                        onclick="editStudent(${s.id})">
                        Изменить
                    </button>

                    <button class="delete-btn"
                        onclick="deleteStudent(${s.id})">
                        Удалить
                    </button>
                </td>
            </tr>
        `;
    }

    if (filteredStudents.length === 0) {
        list.innerHTML = `
            <tr>
                <td colspan="4">Студенты не найдены</td>
            </tr>
        `;
    }
}

async function addStudent() {
    const name = document.getElementById("name").value;
    const group = document.getElementById("group").value;

    const response = await fetch("/students", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: name, group: group })
    });

    if (response.status === 422) {
        alert("Ошибка: проверь имя и группу");
        return;
    }

    document.getElementById("name").value = "";
    document.getElementById("group").value = "";

    loadStudents();
}

async function editStudent(id) {
    const student = allStudents.find(x => x.id === id);

    const newName = prompt("Новое имя:", student.name);
    if (newName === null) return;

    const newGroup = prompt("Новая группа:", student.group);
    if (newGroup === null) return;

    const response = await fetch("/students/" + id, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            name: newName,
            group: newGroup
        })
    });

    if (response.status === 422) {
        alert("Ошибка: проверь имя и группу");
        return;
    }

    loadStudents();
}

async function deleteStudent(id) {
    if (!confirm("Удалить этого студента?")) return;

    await fetch("/students/" + id, {
        method: "DELETE"
    });

    loadStudents();
}

loadStudents();

</script>

</body>
</html>
